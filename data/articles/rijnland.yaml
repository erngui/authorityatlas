authorities:
- name: Hoogheemraadschap van Rijnland
  acronym: HHR
  type: water board in the Netherlands
  remit: Rijnland Regional Water Authority. Manages water levels, flood protection,
    and water quality in the region between roughly Velsen and Gouda, ensuring clean
    water and protection from flooding.
  establishment_country: Netherlands
  regional_remit: Rijnland region
  headquarters_address: Archimedesweg 1, 2333 CM Leiden, Netherlands
  headquarters_city: Leiden
  headquarters_country: Netherlands
  year_established: 1255
  predecessor_organizations: Informal cooperating water boards along the Oude Rijn
    (Old Rhine) river (pre-1248)
  wikidata_id: Q2619632
  coordinates:
    lat: 52.164647
    lon: 4.4655
  website: https://www.rijnland.net
  wikipedia: https://en.wikipedia.org/wiki/Hoogheemraadschap_van_Rijnland
  factoid: 'The oldest water authority in the Netherlands. Mission statement: Dry
    feet and clean water.'
  legal_basis_name: Water Board Act (Waterschapswet, 1991) and original commission
    from Count William II of Holland and Zeeland, 1248
  legal_basis_link: https://wetten.overheid.nl/BWBR0005108/
  head_title: Dijkgraaf (literally Dike Count)
