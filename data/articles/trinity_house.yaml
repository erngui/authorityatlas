# Authority Atlas - Minimal Metadata Version
# Focus: Enable discovery, search, and navigation to authoritative sources
# Philosophy: Index card, not encyclopedia entry
#
# CONVENTIONS:
# - Markdown links supported in 'factoid' field
# - Wikipedia page is required (create if necessary before indexing)
# - Focus on clean, structured metadata for discovery rather than comprehensive content
# - Tags can supplement structured fields with additional searchable information

authorities:

- name: "Trinity House"
  acronym: "TH"
  
  # Core identification
  type: "Executive non-departmental public body"
  remit: "General Lighthouse Authority for England, Wales, the Channel Islands, and Gibraltar, responsible for maritime navigation aids including lighthouses, buoys, and beacons."
  
  # Discoverability
  establishment_country: "United Kingdom"
  regional_remit: "England, Wales, Channel Islands, Gibraltar"
  
  # Location (for mapping and contact)
  headquarters_address: "Tower Hill, London EC3N 4DH, United Kingdom"
  headquarters_city: "London"
  headquarters_country: "United Kingdom"
  
  # Dates (year only for simplicity)
  year_established: 1514
  
  # Organizational evolution
  predecessor_organizations: "Guild of Mariners of Deptford Strand (informal mariners' association, pre-1514)"
  
  # Links to authoritative sources
  website: "https://www.trinityhouse.co.uk/"
  wikipedia: "https://en.wikipedia.org/wiki/Trinity_House"
  
  # Factoid - Context and significance: Why this authority exists, its place in the regulatory ecosystem,
  # and what makes it notable. Focus on: (1) category/similar authorities, (2) origin story/historical moment,
  # (3) significance. Aim for 1-3 sentences that instill wonder about the regulatory landscape.
  factoid: "Trinity House was [established by Royal Charter in 1514](https://www.trinityhouse.co.uk/about-us/history-of-trinity-house/th500) after Thames mariners petitioned the king in 1513 for powers to regulate dangerous unqualified pilots. It represents one of the world's oldest continuously operating maritime safety organizations, predating most modern regulatory concepts."
  
  # Legal basis (founding documents and current framework)
  legal_basis_name: "Royal Charter of 1685 and Merchant Shipping Act 1995"
  legal_basis_link: "https://www.legislation.gov.uk/ukpga/1995/21/contents"
  
  # Leadership structure
  head_title: "Master"
  
  # Tags for search/filtering
  tags: ["United Kingdom", "England", "Wales", "Channel Islands", "Gibraltar", "Lighthouses", "Navigation Aids", "Maritime Safety", "Royal Charter", "Charity", "Public Service", "Coastal Navigation", "Henry VIII", "Historic"]
  
  # Image
  image: "images/trinity_house_logo.png"
  
  # Additional resources beyond official website and Wikipedia
  additional_resources:
    - name: "Grace's Guide to British Industrial History"
      description: "Comprehensive historical account of Trinity House's founding, development of lighthouse technology, and role in British maritime commerce from the Tudor period through industrialization."
      link: "https://www.gracesguide.co.uk/Trinity_House"
    - name: "UK Government Official Page"
      description: "Current statutory responsibilities and relationship with the Department for Transport, including modern regulatory framework for General Lighthouse Authorities."
      link: "https://www.gov.uk/government/organisations/trinity-house"
