      description: "Official ICAO explanation of Standards and Recommended Practices (SARPs), how they work, and their role in global aviation."
      link: "https://www.icao.int/safety-management/sarps-standards-and-recommended-practices"
      
    - name: "SKYbrary: ICAO SARPs Explained"
      description: "Aviation knowledge base article breaking down the structure, purpose, and global adoption of ICAO SARPs in accessible terms."
      link: "https://skybrary.aero/articles/standards-and-recommended-practices-sarps"
      
    - name: "IFATCA: Making SARPs – How Does It Work?"
      description: "Detailed walkthrough from the International Federation of Air Traffic Controllers' Associations on how SARPs are developed within ICAO."
      link: "https://ifatca.org/icao-activities/making-sarps-how-does-it-work/"
